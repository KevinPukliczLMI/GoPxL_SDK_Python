[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GoPxL-SDK-Py"
version = "0.3.0"
description = "Python SDK for programmatic control of Gocator / GoPxL sensors"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LMI Technologies Inc." }]
dependencies = [
    "msgpack>=1.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Installed import name is GoPxL_SDK_Py; source lives in this folder (GoPxL_SDK_Py/).
[tool.setuptools.package-dir]
GoPxL_SDK_Py = "."

[tool.setuptools]
packages = ["GoPxL_SDK_Py"]
